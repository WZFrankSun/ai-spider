name: instagram
category: social

browser:
  viewport:
    width: 1280
    height: 900
  locale: en-US

auth:
  required: true
  home_url: https://www.instagram.com/
  login_url: https://www.instagram.com/accounts/login/
  logged_in_selectors:
    - 'a[href*="/direct/"]'
    - '[aria-label="Home"]'
    - '[aria-label="主页"]'
    - 'svg[aria-label="Home"]'
  login_form_selectors:
    - 'input[name="username"]'
    - 'input[name="password"]'

selectors:
  search_icon: '[aria-label="Search"]'
  search_input: 'input[placeholder="Search"]'
  home_nav: '[aria-label="Home"]'

extraction:
  default_link_pattern: profile
  default_page_type: profile
  link_patterns:
    profile:
      match_regex: 'instagram\.com/([A-Za-z0-9._]+)/?$'
      exclude_if_contains:
        - /p/
        - /reel/
        - /reels/
        - /explore/
        - /tags/
        - /accounts/
        - /direct/
        - /stories/
        - /tv/
        - /blog/
        - /popular/
        - /about/
        - /help/
      url_template: "https://www.instagram.com/{username}/"
      id_field: username
      id_group: 1
  page_types:
    profile:
      fields:
        username:
          source: url
          regex: 'instagram\.com/([A-Za-z0-9._]+)/?'
          group: 1
        display_name:
          selector: "header h2, header section h2"
    tag_page:
      url_patterns:
        - "/explore/tags/"
        - "/tags/"
      item_selector: "article a[href*='/p/']"
      fields:
        post_url:
          selector: "self"
          attr: href

crawl:
  rate_limit_ms: 1500
  scroll_strategy: infinite_scroll
