name: tiktok
category: social

browser:
  viewport:
    width: 390
    height: 844
  locale: en-US

auth:
  required: true
  home_url: https://www.tiktok.com/
  login_url: https://www.tiktok.com/login
  logged_in_selectors:
    - '[data-e2e="nav-upload"]'
    - '[data-e2e="nav-profile"]'
    - '[aria-label="Profile"]'
  login_form_selectors:
    - 'input[name="username"]'
    - 'input[placeholder*="Email"]'
    - 'input[placeholder*="email"]'

selectors:
  for_you_tab: '[data-e2e="nav-for-you"]'
  search_input: 'input[placeholder="Search"]'
  like_button: '[data-e2e="like-icon"]'

extraction:
  default_link_pattern: profile
  default_page_type: profile
  link_patterns:
    profile:
      match_regex: 'tiktok\.com/@([A-Za-z0-9._]+)/?$'
      exclude_if_contains:
        - /video/
        - /live/
      url_template: "https://www.tiktok.com/@{username}"
      id_field: username
      id_group: 1
  page_types:
    profile:
      fields:
        username:
          source: url
          regex: 'tiktok\.com/@([A-Za-z0-9._]+)'
          group: 1
        display_name:
          selector: '[data-e2e="user-title"]'
        follower_count:
          selector: '[data-e2e="followers-count"]'

crawl:
  rate_limit_ms: 2000
  scroll_strategy: infinite_scroll
